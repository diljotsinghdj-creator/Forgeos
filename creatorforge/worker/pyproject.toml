[project]
name = "creatorforge-worker"
version = "1.0.0"
description = "Self-hosted CreatorForge generation worker: idea -> verified MP4"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Install only the backends you use.
whisper = ["faster-whisper>=1.0"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12", "numpy"]
diffusers = ["diffusers>=0.35", "transformers", "accelerate", "torch", "sentencepiece", "protobuf", "ftfy", "imageio", "imageio-ffmpeg"]
test = ["pytest>=8"]

[project.scripts]
creatorforge-worker = "creatorforge_worker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creatorforge_worker*"]
[tool.pytest.ini_options]
markers = ["ffmpeg: needs ffmpeg"]
filterwarnings = ["ignore::DeprecationWarning"]

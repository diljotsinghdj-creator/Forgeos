:root {
  --paper: #F4F1EA;        /* the requested warm paper */

  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
.rail { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.rail .grow { flex: 1 1 200px; min-width: 0; }
button, .seg label, .chip { font: 600 14px/1 var(--f-ui); }
.play { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 11px 20px 11px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--hi); outline-offset: 2px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 9px 14px; cursor: pointer; }
.seg input:checked + span { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 10px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 70%, #fff); border: 1px solid var(--rule); font-weight: 400; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; padding: 0 2px; }
.add { font: 400 14px var(--f-ui); padding: 7px 10px; border: 1px dashed var(--muted); border-radius: 999px; background: transparent; color: var(--ink); width: 210px; max-width: 100%; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.stage > svg { width: 100%; height: 100%; display: block; }
.note { font: 400 13px/1.5 var(--f-ui); color: var(--muted); max-width: 70ch; }
details { border-top: 1px solid var(--rule); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; }
.drawer { display: grid; gap: 10px; padding-top: 10px; }
textarea { width: 100%; min-height: 110px; font: 12px/1.4 var(--f-mono); background: color-mix(in srgb, var(--paper) 60%, #fff); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; box-sizing: border-box; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--s1); }
/* the owner's rule: a Play/Replay + Hide UI bar sits top-right on the stage; Hide UI leaves only the stage */
.bar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; transition: opacity .2s; }
.bar button { font: 600 13px/1 var(--f-ui); border-radius: 999px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.bar .play { padding: 8px 14px 8px 11px; }
.bar svg { width: 11px; height: 11px; fill: currentColor; }
.bar .ghost { background: color-mix(in srgb, var(--paper) 85%, #fff); }
body.clean { padding: 0; }
body.clean .wrap { max-width: none; }
body.clean .rail, body.clean details, body.clean .note { display: none; }

body.clean .bar { opacity: 0; }

  function parse(text, meta) {
    const all = csvRows(text.trim());
    if (all.length < 2) throw new Error('The CSV is empty.');
    const cols = all[0].map(c => c.trim());
    const idx = re => cols.findIndex(c => re.test(c));
    const ent = idx(/^(entity|country|location)$/i), yr = idx(/^(year|date)$/i);
    if (ent < 0 || yr < 0) throw new Error('The CSV needs an "entity" (or "country") column and a "year" column.');
    const body = all.slice(1);
    const vc = cols.findIndex((c, i) => i !== ent && i !== yr && !/^code$/i.test(c) && body.some(r => r[i] !== '' && r[i] != null && !isNaN(+r[i])));
    if (vc < 0) throw new Error('No numeric value column found next to entity and year.');
    const byEntity = new Map();
    let lo = Infinity, hi = -Infinity;
    for (const r of body) {
      const v = r[vc], y = parseInt(r[yr], 10);
      if (v === '' || v == null || isNaN(+v) || isNaN(y)) continue;
      if (!byEntity.has(r[ent])) byEntity.set(r[ent], []);
      byEntity.get(r[ent]).push({ year: y, value: +v });
      lo = Math.min(lo, +v); hi = Math.max(hi, +v);
    }
    if (!byEntity.size) throw new Error('No rows with a number in them.');
    for (const a of byEntity.values()) a.sort((p, q) => p.year - q.year);
    return { byEntity, meta: { ...meta, column: cols[vc], max: meta.max ?? niceMax(hi), min: Math.min(0, lo) } };
  }

  function setData(newDs, defaultPicks) {
    ds = newDs;
    const names = [...ds.byEntity.keys()].sort((a, b) => a.localeCompare(b));
    const list = document.getElementById('entities');
    list.replaceChildren(...names.map(n => { const o = document.createElement('option'); o.value = n; return o; }));
    picks = defaultPicks.filter(n => ds.byEntity.has(n)).slice(0, 5);
    if (!picks.length) picks = names.includes('World') ? ['World'] : names.slice(0, 3);
    renderChips();
    document.getElementById('note').textContent = `${ds.meta.subtitle}. ${ds.meta.source}. Space replays; H hides the controls for a clean screen recording.`;
    finish();
  }

  // ---------- controls ----------
  function renderChips() {
    const box = document.getElementById('chips');
    box.replaceChildren(...picks.map((p, i) => {
      const chip = document.createElement('span'); chip.className = 'chip';
      const dot = document.createElement('i'); dot.style.background = colorOf(p, i);
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + p);
      x.onclick = () => { picks.splice(i, 1); renderChips(); finish(); };
      chip.append(dot, document.createTextNode(p), x); return chip;
    }));
  }
  function colorOf(name, i) {
    if (name === 'World') return COLORS.ink;
    const w = picks.indexOf('World');
    return COLORS.series[(i - (w > -1 && w < i ? 1 : 0)) % COLORS.series.length];
  }
  document.getElementById('add').addEventListener('change', e => {
    const v = e.target.value.trim();
    if (ds.byEntity.has(v) && !picks.includes(v)) { if (picks.length >= 5) picks.shift(); picks.push(v); renderChips(); finish(); }
    e.target.value = '';
  });
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', e => { mode = e.target.value; play(); }));
  document.getElementById('play').addEventListener('click', play);
  const hideBtn = document.getElementById('hide');
  const hide = on => { document.body.classList.toggle('clean', on); hideBtn.textContent = on ? 'Show UI' : 'Hide UI'; hideBtn.setAttribute('aria-pressed', on); };
  hideBtn.addEventListener('click', () => hide(!document.body.classList.contains('clean')));
  document.addEventListener('keydown', e => {
    if (e.target.closest('textarea, input:not([type=radio]):not([type=file])')) return;   // typing keeps its own keys
    if (e.key === ' ') { if (e.target.closest('button')) return; e.preventDefault(); play(); }   // a focused button presses itself
    else if (e.key === 'h' || e.key === 'H') hide(!document.body.classList.contains('clean'));
    else if (e.key === 'Escape') hide(false);
  });

  const status = (msg, err) => { const s = document.getElementById('status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); };
  function loadText(text, label) {
    try {
      const d = parse(text, { title: label || 'Our World in Data', subtitle: 'Your data', unit: '', source: 'Source: Our World in Data (pasted CSV)', max: undefined });
      d.meta.subtitle = d.meta.column.replace(/_/g, ' ');
      setData(d, ['World']);
      status(`Loaded ${d.byEntity.size} entities · column "${d.meta.column}".`);
    } catch (err) { status(err.message, true); }
  }
  document.getElementById('load').addEventListener('click', () => loadText(document.getElementById('csvtext').value));
  document.getElementById('file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => loadText(String(r.result), f.name.replace(/\.csv$/i, '').replace(/[-_]/g, ' ')); r.readAsText(f);
  });
  const embedded = () => parse(document.getElementById('owid-data').textContent, DEFAULT);
  document.getElementById('reset').addEventListener('click', () => { setData(embedded(), DEFAULT.picks); status('Back to the electricity data.'); });

  // ---------- playback: stepped at 12 fps, like hand-drawn animation ----------
  const TOTAL = DRAW_FRAMES + HI_FRAMES + HOLD_FRAMES;
  function play() {
    cancelAnimationFrame(timer);
    if (reduce) { frame = TOTAL; finish(); return; }
    frame = 0; lastT = 0; setBtn('Playing');
    const tick = t => {
      if (!lastT || t - lastT >= 1000 / FPS) { lastT = t; draw(frame); frame++; }
      if (frame < TOTAL) timer = requestAnimationFrame(tick); else setBtn('Replay');
    };
    timer = requestAnimationFrame(tick);
  }
  function finish() { cancelAnimationFrame(timer); draw(TOTAL - 1); setBtn(frame ? 'Replay' : 'Play'); }
  function setBtn(label) { document.querySelector('#play span').textContent = label; }

  // ---------- the hand-drawn pen (in place of Rough.js) ----------
  function rng(seed) {   // mulberry32: the same seed draws the same wobble, a new seed each frame makes the line boil
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function wobble(pts, amp, seed, step = 14) {   // subdivide, then push each point sideways a little
    const r = rng(seed), out = [];
    for (let k = 0; k < pts.length - 1; k++) {
      const [x0, y0] = pts[k], [x1, y1] = pts[k + 1], len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / step));
      const nx = -(y1 - y0) / (len || 1), ny = (x1 - x0) / (len || 1);
      for (let j = 0; j < n; j++) {
        const u = j / n, o = (r() - .5) * 2 * amp * (k === 0 && j === 0 ? .3 : 1);
        out.push([x0 + (x1 - x0) * u + nx * o, y0 + (y1 - y0) * u + ny * o]);
      }
    }
    const L = pts[pts.length - 1]; out.push([L[0] + (r() - .5) * amp * .6, L[1] + (r() - .5) * amp * .6]);
    return out;
  }
  function smooth(p) {   // Catmull-Rom through the points, as cubic Béziers
    if (p.length < 3) return 'M' + p.map(q => q.map(v => v.toFixed(1)).join(' ')).join('L');
    let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
      d += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
    }
    return d;
  }
  function pen(pts, { stroke, width = 2, amp = 1.3, seed = 1, passes = 2, parent } = {}) {   // two loose passes, like a marker
    const g = el('g', { fill: 'none', stroke, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
    for (let k = 0; k < passes; k++) el('path', { d: smooth(wobble(pts, amp, seed + k * 101)), opacity: k ? .55 : 1, 'stroke-width': k ? width * .7 : width }, g);
    return g;
  }
  function blob(cx, cy, r, fill, seed) {   // a hand-drawn dot: a slightly lumpy filled circle
    const q = rng(seed), pts = [];
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, rr = r * (0.9 + q() * .2); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
    pts.push(pts[0], pts[1]);
    el('path', { d: smooth(pts.slice(0, 13)) + 'Z', fill, stroke: fill, 'stroke-width': 1.2 });
  }
  let clipN = 0;
  function hatchRect(x, y, w, h, color, seed) {   // hachure fill at -41°, clipped to the bar, plus a loose outline
    const id = 'hc' + (++clipN), cp = el('clipPath', { id }, defs());
    el('rect', { x, y, width: w, height: h }, cp);
    const g = el('g', { 'clip-path': `url(#${id})` });
    const gap = 7, run = h / Math.tan(41 * Math.PI / 180);
    for (let t = -run, k = 0; t < w + gap; t += gap, k++) pen([[x + t, y + h + 2], [x + t + run, y - 2]], { stroke: color, width: 2, amp: .9, seed: seed + k, passes: 1, parent: g });
    pen([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y + .5]], { stroke: color, width: 1.6, amp: 1.1, seed: seed + 999 });
  }
  function highlighter(x, y, w, h, t, seed) {   // the yellow signal: a skewed marker swipe, multiplied onto the paper
    if (t <= 0) return;
    const ww = w * t, sk = 4, q = rng(seed), j = () => (q() - .5) * 3;
    const pts = [[x - 6 + j(), y + sk + j()], [x - 6 + ww + j(), y + j()], [x - 6 + ww + j(), y + h - sk + j()], [x - 6 + j(), y + h + j()]];
    const p = el('path', { d: 'M' + pts.map(a => a.map(v => v.toFixed(1)).join(' ')).join('L') + 'Z', fill: COLORS.hi, opacity: .85 });
    p.style.mixBlendMode = 'multiply';
  }

  // ---------- drawing ----------
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    (parent || svg).appendChild(e); return e;
  }
  const defs = () => svg.querySelector('defs') || el('defs', {});
  const txt = (x, y, s, o = {}) => el('text', { x, y, 'font-family': o.font || FONT.ui, 'font-size': o.size || 16, 'font-weight': o.weight || 400,
    fill: o.fill || COLORS.muted, 'text-anchor': o.anchor || 'start', 'font-variant-numeric': 'tabular-nums' }, null, s);

  function frameState(f) {
    return { p: easeInOut(Math.min(1, f / (DRAW_FRAMES - 1))), hi: clamp((f - DRAW_FRAMES) / (HI_FRAMES - 1), 0, 1), seed: 1 + (f % 997) };
  }
  function chrome(m) {
    [...svg.querySelectorAll(':scope > :not(title)')].forEach(n => n.remove());
    clipN = 0;
    el('rect', { x: 0, y: 0, width: W, height: H, fill: COLORS.paper });
    txt(M.l, 74, m.title, { font: FONT.hand, weight: 700, size: 44, fill: COLORS.ink });
    txt(M.l, 108, m.subtitle, { size: 20 });
    txt(M.l, H - 30, m.source, { font: FONT.mono, size: 14 });    // the receipt: bottom-left, monospace
  }
  const unit = m => (m.unit === '%' ? '%' : '');

  function drawLine(f) {
    const { p, hi, seed } = frameState(f);
    const m = ds.meta; chrome(m);
    const series = picks.map((n, i) => ({ name: n, color: colorOf(n, i), data: ds.byEntity.get(n) || [] })).filter(s => s.data.length);
    if (!series.length) return;
    const years = series.flatMap(s => s.data.map(d => d.year));
    const y0 = Math.min(...years), y1 = Math.max(...years);
    const x = linear(y0, y1, M.l, W - M.r), y = linear(m.min, m.max, H - M.b, M.t);
    for (const t of ticks(m.min, m.max, 5)) {   // grid and labels stay still; only the ink boils
      el('line', { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t), stroke: COLORS.rule, 'stroke-width': 1, 'stroke-dasharray': '2 6' });
      txt(M.l - 14, y(t) + 5, fmt(t) + unit(m), { anchor: 'end' });
    }
    for (const t of ticks(y0, y1, Math.min(8, y1 - y0))) if (Number.isInteger(t)) txt(x(t), H - M.b + 30, t, { anchor: 'middle' });
    pen([[M.l, H - M.b], [W - M.r, H - M.b]], { stroke: COLORS.ink, width: 1.4, amp: 1, seed });
    const head = y0 + (y1 - y0) * p, ends = [];
    series.forEach((s, i) => {
      const pts = [];
      for (let k = 0; k < s.data.length; k++) {
        const d = s.data[k];
        if (d.year <= head) pts.push([x(d.year), y(d.value)]);
        else { const a = s.data[k - 1]; if (a) { const u = (head - a.year) / (d.year - a.year); pts.push([x(head), y(a.value + (d.value - a.value) * u)]); } break; }
      }
      if (pts.length < 2) return;
      const world = s.name === 'World';
      pen(pts, { stroke: s.color, width: world ? 3.6 : 2.4, amp: 1.2, seed: seed + i * 7 });
      const last = pts[pts.length - 1];
      blob(last[0], last[1], world ? 6.5 : 5, s.color, seed + i);
      ends.push({ s, y: last[1], val: y.invert(last[1]), world });
    });
    ends.sort((a, b) => a.y - b.y);   // end labels, nudged apart so they never overlap
    ends.forEach(e => { e.ly = e.y; });
    for (let k = 1; k < ends.length; k++) if (ends[k].ly - ends[k - 1].ly < 34) ends[k].ly = ends[k - 1].ly + 34;
    const overflow = ends.length ? ends[ends.length - 1].ly - (H - M.b + 10) : 0;
    if (overflow > 0) ends.forEach(e => { e.ly -= overflow; });
    const lx = W - M.r + 26;
    ends.forEach(e => {
      if (e.world && p >= 1) highlighter(lx - 4, e.ly - 26, 210, 40, hi, seed);
      txt(lx, e.ly + 2, fmt(e.val) + unit(m), { weight: e.world ? 800 : 600, size: e.world ? 24 : 18, fill: e.world ? COLORS.ink : e.s.color });
      txt(lx + (e.world ? 86 : 70), e.ly + 1, shortName(e.s.name), { font: FONT.hand, size: e.world ? 19 : 15, fill: e.world ? COLORS.ink : e.s.color });
    });
    txt(W - M.r, M.t - 12, Math.floor(head), { font: FONT.hand, size: 34, anchor: 'end' });   // the year being drawn
  }

  function drawBars(f) {
    const { p, hi, seed } = frameState(f);
    const m = ds.meta; chrome(m);
    const rows = picks.map((n, i) => { const a = ds.byEntity.get(n) || []; const d = a[a.length - 1]; return d && { name: n, color: colorOf(n, i), value: d.value, year: d.year }; }).filter(Boolean);
    if (!rows.length) return;
    rows.sort((a, b) => b.value - a.value);
    txt(W - M.r + 180, M.t - 18, [...new Set(rows.map(r => r.year))].join('–'), { font: FONT.hand, size: 34, anchor: 'end' });
    const left = M.l + 250, right = W - 170, xs = linear(Math.min(0, m.min), m.max, left, right);
    const top = M.t + 6, bottom = H - M.b, slot = (bottom - top) / rows.length, bh = slot * .68;
    for (const t of ticks(Math.min(0, m.min), m.max, 5)) {
      el('line', { x1: xs(t), x2: xs(t), y1: M.t, y2: H - M.b, stroke: COLORS.rule, 'stroke-dasharray': '2 6' });
      txt(xs(t), H - M.b + 28, fmt(t) + unit(m), { size: 15, anchor: 'middle' });
    }
    rows.forEach((r, i) => {
      const yy = top + slot * i + (slot - bh) / 2, st = clamp(p * 1.35 - i * 0.07, 0, 1), w = (xs(r.value) - xs(0)) * easeOut(st), world = r.name === 'World';
      txt(left - 16, yy + bh / 2 + 6, shortName(r.name), { font: FONT.hand, size: world ? 21 : 18, weight: world ? 700 : 400, fill: COLORS.ink, anchor: 'end' });
      if (w > 2) hatchRect(xs(0), yy, w, bh, r.color, seed + i * 5);
      if (world && p >= 1) highlighter(xs(0) + w + 14, yy + bh / 2 - 20, 110, 38, hi, seed);
      if (st > 0.05) txt(xs(0) + w + 16, yy + bh / 2 + 7, fmt(r.value * Math.min(1, st * 1.1)) + unit(m), { weight: 800, size: 20, fill: COLORS.ink });
    });
  }

  const shortName = n => n.replace('-income countries', ' income').replace(' countries', '');
  function draw(f) { if (!ds) return; (mode === 'bars' ? drawBars : drawLine)(f); svg.querySelector('title').textContent = `${ds.meta.title} ${ds.meta.subtitle}`; }

  // ---------- start ----------
  setData(embedded(), DEFAULT.picks);
  play();
})();
</script>

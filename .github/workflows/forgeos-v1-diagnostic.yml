name: ForgeOS v1 Diagnostic Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forgeos-v1-diagnostic.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build request
        uses: actions/checkout@v4
        with:
          ref: build-requests
      - name: Extract AndroidX-fixed project
        shell: bash
        run: |
          set -euo pipefail
          test -f build-requests/android-1791153362283.zip
          mkdir remote-project
          python - <<'PY'
          import zipfile, os
          p="build-requests/android-1791153362283.zip"; out="remote-project"
          base=os.path.realpath(out)+os.sep
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  target=os.path.realpath(os.path.join(out,i.filename))
                  if not target.startswith(base): raise SystemExit("Unsafe ZIP path")
              z.extractall(out)
          PY
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          ROOT="$(find remote-project -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)"
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        id: gradle_build
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/forgeos-diagnostics"
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/forgeos-diagnostics/gradle-build.log"
      - name: Upload build diagnostics
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ForgeOS-build-diagnostics-v1
          path: forgeos-diagnostics/gradle-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p forgeos-output
          find "${{ steps.project.outputs.root }}" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} forgeos-output/ \;
          test -n "$(find forgeos-output -name '*.apk' -print -quit)"
          sha256sum forgeos-output/*.apk | tee forgeos-output/SHA256SUMS.txt
      - name: Upload built APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ForgeOS-v1-debug-apk
          path: forgeos-output/
          if-no-files-found: error
          retention-days: 7

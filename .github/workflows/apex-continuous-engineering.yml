name: APEX Continuous Engineering Gate

on:
  push:
    branches:
      - apex-v0.1-core
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/apex-continuous-engineering.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Static source guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=build --exclude-dir=.git -E '(ghp_|github_pat_)[A-Za-z0-9_]+' .
          ! grep -RIn --exclude-dir=build --exclude-dir=.git -E 'http://api\.github\.com' app/src || true

      - name: Compile, lint and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apex-diagnostics
          set +e
          gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug 2>&1 | tee apex-diagnostics/gradle.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E '(^FAILURE:|^\* What went wrong:|^Execution failed|error:|Exception|Caused by:)' apex-diagnostics/gradle.log | tail -n 120 > apex-diagnostics/failure-summary.txt || true
            exit "$rc"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-failure-diagnostics-${{ github.sha }}
          path: apex-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          sha256sum "$APK" | tee APK-SHA256SUMS.txt
          grep -F "  $APK" APK-SHA256SUMS.txt >/dev/null

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-forgeos-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            APK-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
